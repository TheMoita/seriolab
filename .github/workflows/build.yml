name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure environment (.env)
        run: |
          if [ -n "${{ secrets.TMDB_API_KEY }}" ]; then
            echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env
          else
            echo "TMDB_API_KEY=***REMOVED***" > .env
          fi
          echo "TMDB_BASE_URL=https://api.themoviedb.org/3" >> .env
          echo "TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500" >> .env
          echo "TMDB_LANGUAGE=pt-PT" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seriolab-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
