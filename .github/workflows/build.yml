name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure environment (.env)
        run: |
          TMDB_KEY="${{ secrets.TMDB_API_KEY }}"
          if [ -n "$TMDB_KEY" ]; then
            echo "TMDB_API_KEY=$TMDB_KEY" > .env
          else
            touch .env
          fi
          echo "TMDB_BASE_URL=https://api.themoviedb.org/3" >> .env
          echo "TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500" >> .env
          echo "TMDB_LANGUAGE=pt-PT" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Ensure TMDB .env before build
        run: |
          if [ ! -f .env ]; then
            touch .env
            echo "TMDB_BASE_URL=https://api.themoviedb.org/3" >> .env
            echo "TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500" >> .env
            echo "TMDB_LANGUAGE=pt-PT" >> .env
          fi
          echo "Variáveis presentes no .env:"
          cut -d'=' -f1 .env

      - name: Configure Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "A descodificar release keystore a partir dos GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=app/upload-keystore.jks" >> android/key.properties
            echo "android/key.properties configurado com sucesso."
          else
            echo "KEYSTORE_BASE64 não configurado nos Secrets. A usar debug keystore como fallback..."
            mkdir -p ~/.android
            if [ -f android/app/debug.keystore ]; then
              cp android/app/debug.keystore ~/.android/debug.keystore
            else
              keytool -genkeypair -v \
                -keystore android/app/debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              cp android/app/debug.keystore ~/.android/debug.keystore
            fi
          fi

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}"

      - name: Rename Release APK
        run: |
          VERSION="${{ github.ref_name }}"
          # Fallback se não for disparado por tag:
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="v1.0.${{ github.run_number }}"
          fi
          # Remove eventuais prefixos 'v' duplicados se necessário
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v*//')
          TAG="v${CLEAN_VERSION}"
          APK_NAME="seriolab-${TAG}.apk"
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            mv "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/${APK_NAME}"
          fi
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Renamed release APK to: ${APK_NAME}"
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: seriolab-release-apk
          path: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
