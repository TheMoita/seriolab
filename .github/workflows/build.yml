name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure environment (.env)
        run: |
          TMDB_KEY="${{ secrets.TMDB_API_KEY }}"
          if [ -z "$TMDB_KEY" ]; then
            TMDB_KEY="***REMOVED***"
          fi
          echo "TMDB_API_KEY=$TMDB_KEY" > .env
          echo "TMDB_BASE_URL=https://api.themoviedb.org/3" >> .env
          echo "TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500" >> .env
          echo "TMDB_LANGUAGE=pt-PT" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Ensure TMDB .env before build
        run: |
          if [ ! -f .env ] || ! grep -q '^TMDB_API_KEY=.\+' .env; then
            echo "TMDB_API_KEY=***REMOVED***" > .env
            echo "TMDB_BASE_URL=https://api.themoviedb.org/3" >> .env
            echo "TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500" >> .env
          fi
          echo "Variáveis presentes no .env:"
          cut -d'=' -f1 .env

      - name: Build Android Release APK
        run: |
          TMDB_KEY="${{ secrets.TMDB_API_KEY }}"
          if [ -z "$TMDB_KEY" ]; then
            TMDB_KEY="***REMOVED***"
          fi
          flutter build apk --release --dart-define=TMDB_API_KEY="$TMDB_KEY"

      - name: Upload APK Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: seriolab-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Determine Version & Tag
        id: versioning
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' "\r')
          BASE_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          TAG_NAME="v${BASE_VERSION}-b${{ github.run_number }}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: Seriolab v${{ steps.versioning.outputs.base_version }} (Build ${{ github.run_number }})
          generate_release_notes: true
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
